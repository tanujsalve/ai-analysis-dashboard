<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | AI Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="firebase-config.js?v=2" defer></script>
</head>
<body>
<div class="auth-container">
  <div class="auth-header">
    <h2>Welcome Back</h2>
    <p class="auth-subtitle">Sign in to your AI Dashboard account</p>
  </div>

  <div id="error-message" class="error" style="display: none;"></div>
  <div id="success-message" class="success" style="display: none;"></div>

  <form id="login-form" class="auth-form">
    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="Enter your email" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" required>
    </div>
    <div class="form-group checkbox-group">
      <label class="checkbox-label">
        <input type="checkbox" id="remember-me">
        <span class="checkmark"></span>
        Remember me
      </label>
      <a href="#" id="forgot-password" class="forgot-link">Forgot password?</a>
    </div>
    <button type="submit" class="auth-btn" id="login-btn">
      <span class="btn-text">Sign In</span>
      <div class="btn-loader" style="display: none;"></div>
    </button>
    <div class="auth-links">
      <p>Don't have an account? <a href="register.html">Create Account</a></p>
    </div>
  </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const loginForm = document.getElementById('login-form');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const loginBtn = document.getElementById('login-btn');
  const btnText = document.querySelector('.btn-text');
  const btnLoader = document.querySelector('.btn-loader');
  const errorDiv = document.getElementById('error-message');
  const successDiv = document.getElementById('success-message');
  const forgotPasswordLink = document.getElementById('forgot-password');

  // Check if user is already logged in via localStorage
  const storedUserData = localStorage.getItem('currentUser');
  if (storedUserData) {
    try {
      const userData = JSON.parse(storedUserData);
      redirectToDashboard(userData);
      return; // Exit early to prevent further execution
    } catch (e) {
      console.error('Error parsing user data:', e);
      localStorage.removeItem('currentUser');
    }
  }

  loginForm.addEventListener('submit', async function(e) {
    e.preventDefault();

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {
      showError('Please fill in all fields');
      return;
    }

    showLoading(true);

    try {
      const userCredential = await window.signInWithEmailAndPassword(email, password);
      const user = userCredential.user;

      // Get user profile from Firestore
      const userDoc = await window.getDoc(window.doc(window.db, 'users', user.uid));
      let userData = {
        id: user.uid,
        email: user.email,
        name: user.displayName || user.email.split('@')[0],
        role: 'user'
      };

      if (userDoc.exists) {
        userData = { ...userData, ...userDoc.data() };
      } else {
        // Create user document if it doesn't exist
        await window.setDoc(window.doc(window.db, 'users', user.uid), {
          name: userData.name,
          email: userData.email,
          role: 'user',
          createdAt: new Date().toISOString(),
          lastLogin: new Date().toISOString()
        });
      }

      // Update last login
      await window.updateDoc(window.doc(window.db, 'users', user.uid), {
        lastLogin: new Date().toISOString()
      });

      // Store user data in localStorage for dashboard use
      localStorage.setItem('currentUser', JSON.stringify(userData));

      showSuccess('Login successful! Redirecting...');
      setTimeout(() => {
        redirectToDashboard(userData);
      }, 1000);

    } catch (error) {
      console.error('Login error:', error);
      let errorMessage = 'Login failed. Please try again.';

      switch (error.code) {
        case 'auth/user-not-found':
          errorMessage = 'No account found with this email address.';
          break;
        case 'auth/wrong-password':
          errorMessage = 'Incorrect password.';
          break;
        case 'auth/invalid-email':
          errorMessage = 'Invalid email address.';
          break;
        case 'auth/user-disabled':
          errorMessage = 'This account has been disabled.';
          break;
        case 'auth/too-many-requests':
          errorMessage = 'Too many failed attempts. Please try again later.';
          break;
      }

      showError(errorMessage);
    } finally {
      showLoading(false);
    }
  });

  forgotPasswordLink.addEventListener('click', async function(e) {
    e.preventDefault();

    const email = emailInput.value.trim();
    if (!email) {
      showError('Please enter your email address first');
      return;
    }

    try {
      await window.sendPasswordResetEmail(email);
      showSuccess('Password reset email sent! Check your inbox.');
    } catch (error) {
      console.error('Password reset error:', error);
      showError('Failed to send password reset email. Please try again.');
    }
  });

  function showLoading(loading) {
    if (loading) {
      btnText.style.display = 'none';
      btnLoader.style.display = 'block';
      loginBtn.disabled = true;
    } else {
      btnText.style.display = 'inline';
      btnLoader.style.display = 'none';
      loginBtn.disabled = false;
    }
  }

  function showError(message) {
    errorDiv.textContent = message;
    errorDiv.style.display = 'block';
    successDiv.style.display = 'none';
  }

  function showSuccess(message) {
    successDiv.textContent = message;
    successDiv.style.display = 'block';
    errorDiv.style.display = 'none';
  }

  function redirectToDashboard(userData) {
    if (userData.role === 'admin') {
      window.location.href = 'admin_dashboard.html';
    } else {
      window.location.href = 'user_dashboard.html';
    }
  }
});
</script>

<style>
/* Auth Container - Matching Dashboard Style */
.auth-container {
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(20px);
  width: 450px;
  padding: 3rem;
  margin: 2rem auto;
  border-radius: 20px;
  box-shadow: 0 25px 50px rgba(56, 62, 78, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.2);
  animation: slideUp 0.6s ease-out;
  position: relative;
  overflow: hidden;
}

.auth-container::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, #667eea, #764ba2);
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.auth-header {
  text-align: center;
  margin-bottom: 2rem;
}

.auth-header h2 {
  font-size: 2.2rem;
  font-weight: 700;
  margin-bottom: 0.5rem;
  background: linear-gradient(135deg, #667eea, #764ba2);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.auth-subtitle {
  color: #64748b;
  font-size: 1.1rem;
  margin: 0;
}

/* Form Styles */
.auth-form {
  margin: 0;
}

.form-group {
  margin-bottom: 1.5rem;
}

.form-group label {
  display: block;
  margin-bottom: 0.5rem;
  font-weight: 600;
  color: #2c3e50;
  font-size: 0.95rem;
}

.form-group input {
  width: 100%;
  padding: 1rem 1.2rem;
  border: 2px solid #e1e8ed;
  border-radius: 12px;
  font-size: 1rem;
  transition: all 0.3s ease;
  background: rgba(255, 255, 255, 0.8);
  font-family: inherit;
}

.form-group input:focus {
  outline: none;
  border-color: #667eea;
  box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
  background: white;
}

.form-group input::placeholder {
  color: #95a5a6;
}

/* Checkbox Group */
.checkbox-group {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1rem;
}

.checkbox-label {
  display: flex;
  align-items: center;
  cursor: pointer;
  font-size: 0.9rem;
  color: #64748b;
}

.checkbox-label input[type="checkbox"] {
  margin-right: 0.5rem;
}

.forgot-link {
  color: #667eea;
  text-decoration: none;
  font-weight: 500;
  font-size: 0.9rem;
  transition: color 0.3s ease;
}

.forgot-link:hover {
  color: #764ba2;
  text-decoration: underline;
}

/* Button Styles */
.auth-btn {
  width: 100%;
  padding: 1rem;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 1.1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  margin-bottom: 1.5rem;
  position: relative;
  overflow: hidden;
}

.auth-btn::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
  transition: left 0.5s;
}

.auth-btn:hover::before {
  left: 100%;
}

.auth-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
}

.auth-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

.btn-loader {
  width: 20px;
  height: 20px;
  border: 2px solid #ffffff;
  border-top: 2px solid transparent;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* Links */
.auth-links {
  text-align: center;
  margin-top: 1.5rem;
}

.auth-links a {
  color: #667eea;
  text-decoration: none;
  font-weight: 500;
  transition: color 0.3s ease;
}

.auth-links a:hover {
  color: #764ba2;
  text-decoration: underline;
}

.auth-links p {
  margin: 0.5rem 0;
  color: #64748b;
  font-size: 0.9rem;
}

/* Messages */
.error {
  background: linear-gradient(135deg, #ff9a9e, #fecfef);
  color: #e74c3c;
  padding: 1rem;
  border-radius: 8px;
  margin-bottom: 1rem;
  border-left: 4px solid #e74c3c;
}

.success {
  background: linear-gradient(135deg, #a8edea, #fed6e3);
  color: #27ae60;
  padding: 1rem;
  border-radius: 8px;
  margin-bottom: 1rem;
  border-left: 4px solid #27ae60;
}

/* Responsive Design */
@media (max-width: 768px) {
  .auth-container {
    width: 90%;
    max-width: 400px;
    padding: 2rem;
    margin: 1rem auto;
  }

  .auth-header h2 {
    font-size: 1.8rem;
  }

  .checkbox-group {
    flex-direction: column;
    align-items: flex-start;
    gap: 0.5rem;
  }
}
</style>
</body>
</html>
