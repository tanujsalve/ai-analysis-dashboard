<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | AI Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="firebase-config.js?v=2" defer></script>
</head>
<body>
<div class="auth-container">
  <div class="auth-header">
    <h2>Create Account</h2>
    <p class="auth-subtitle">Join the AI Dashboard community</p>
  </div>

  <div id="error-message" class="error" style="display: none;"></div>
  <div id="success-message" class="success" style="display: none;"></div>

  <form id="register-form" class="auth-form">
    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Enter your full name" required>
    </div>
    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="Enter your email address" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Create a password (min. 6 characters)" required>
    </div>
    <div class="form-group">
      <label for="confirm-password">Confirm Password</label>
      <input type="password" id="confirm-password" placeholder="Confirm your password" required>
    </div>
    <div class="form-group">
      <label for="role">Account Type</label>
      <select id="role" required>
        <option value="user">User</option>
        <option value="admin">Admin</option>
      </select>
    </div>
    <div class="form-group checkbox-group">
      <label class="checkbox-label">
        <input type="checkbox" id="terms" required>
        <span class="checkmark"></span>
        I agree to the <a href="#" style="color: #667eea;">Terms of Service</a>
      </label>
    </div>
    <button type="submit" class="auth-btn" id="register-btn">
      <span class="btn-text">Create Account</span>
      <div class="btn-loader" style="display: none;"></div>
    </button>
    <div class="auth-links">
      <p>Already have an account? <a href="login.html">Sign in</a></p>
    </div>
  </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  console.log('DOM loaded, checking Firebase...');

  // Wait for Firebase to be available
  const checkFirebase = () => {
    if (typeof firebase !== 'undefined' && window.auth && window.createUserWithEmailAndPassword) {
      console.log('Firebase is ready!');
      initializeForm();
    } else {
      console.log('Firebase not ready, waiting...');
      setTimeout(checkFirebase, 100);
    }
  };

  checkFirebase();

  function initializeForm() {
    const registerForm = document.getElementById('register-form');
    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirm-password');
    const roleSelect = document.getElementById('role');
    const termsCheckbox = document.getElementById('terms');
    const registerBtn = document.getElementById('register-btn');
    const btnText = document.querySelector('.btn-text');
    const btnLoader = document.querySelector('.btn-loader');
    const errorDiv = document.getElementById('error-message');
    const successDiv = document.getElementById('success-message');

    registerForm.addEventListener('submit', async function(e) {
      e.preventDefault();

      const name = nameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;
      const role = roleSelect.value;

      // Validation
      if (!name || !email || !password || !confirmPassword || !role) {
        showError('Please fill in all fields');
        return;
      }

      if (password !== confirmPassword) {
        showError('Passwords do not match');
        return;
      }

      if (password.length < 6) {
        showError('Password must be at least 6 characters long');
        return;
      }

      if (!termsCheckbox.checked) {
        showError('Please accept the Terms of Service');
        return;
      }

      showLoading(true);

      try {
        console.log('Starting registration process...');
        console.log('Email:', email);
        console.log('Role:', role);
        console.log('Firebase available:', typeof firebase !== 'undefined');
        console.log('Auth available:', !!window.auth);
        console.log('createUserWithEmailAndPassword available:', !!window.createUserWithEmailAndPassword);

        // Create user with Firebase Auth
        console.log('Creating user with Firebase Auth...');
        const userCredential = await window.createUserWithEmailAndPassword(email, password);
        const user = userCredential.user;
        console.log('User created successfully:', user.uid);

        // Update display name
        console.log('Updating display name...');
        await window.updateProfile(user, {
          displayName: name,
        });
        console.log('Display name updated');

        // Create user document in Firestore
        console.log('Creating user document in Firestore...');
        const userDocRef = window.doc(window.db, 'users', user.uid);
        await window.setDoc(userDocRef, {
          name: name,
          email: email,
          role: role,
          createdAt: new Date().toISOString(),
          lastLogin: new Date().toISOString(),
          profileComplete: false,
        });
        console.log('User document created in Firestore');

        // Store user data in localStorage for dashboard use
        const userData = {
          id: user.uid,
          email: user.email,
          name: name,
          role: role,
        };
        localStorage.setItem('currentUser', JSON.stringify(userData));
        console.log('User data stored in localStorage');

        showSuccess('Account created successfully! Redirecting...');
        setTimeout(() => {
          redirectToDashboard(userData);
        }, 1500);
      } catch (error) {
        console.error('Registration error:', error);
        console.error('Error code:', error.code);
        console.error('Error message:', error.message);

        let errorMessage = 'Registration failed. Please try again.';

        // Check if Firebase is properly initialized
        if (typeof firebase === 'undefined') {
          errorMessage = 'Firebase is not loaded. Please refresh the page and try again.';
        } else if (!window.auth) {
          errorMessage = 'Firebase Auth is not initialized. Please check your configuration.';
        } else if (!window.createUserWithEmailAndPassword) {
          errorMessage = 'Firebase Auth method is not available. Please check your configuration.';
        } else {
          // Firebase-specific error codes
          switch (error.code) {
            case 'auth/email-already-in-use':
              errorMessage = 'An account with this email already exists.';
              break;
            case 'auth/invalid-email':
              errorMessage = 'Invalid email address.';
              break;
            case 'auth/weak-password':
              errorMessage = 'Password is too weak. Please use at least 6 characters.';
              break;
            case 'auth/operation-not-allowed':
              errorMessage = 'Email/password accounts are not enabled. Please enable it in Firebase Console > Authentication > Sign-in method.';
              break;
            case 'auth/api-key-not-valid':
              errorMessage = 'Invalid API key. Please check your Firebase configuration.';
              break;
            case 'auth/app-not-authorized':
              errorMessage = 'App not authorized. Please check domain restrictions in Firebase Console.';
              break;
            case 'auth/network-request-failed':
              errorMessage = 'Network error. Please check your internet connection.';
              break;
            case 'auth/too-many-requests':
              errorMessage = 'Too many requests. Please try again later.';
              break;
            case 'auth/user-disabled':
              errorMessage = 'This user account has been disabled.';
              break;
            case 'auth/requires-recent-login':
              errorMessage = 'This operation requires recent authentication. Please log in again.';
              break;
            default:
              errorMessage = `Registration failed: ${error.message || 'Unknown error'}`;
              break;
          }
        }

        showError(errorMessage);
      } finally {
        showLoading(false);
      }
    });

    function showLoading(loading) {
      if (loading) {
        btnText.style.display = 'none';
        btnLoader.style.display = 'block';
        registerBtn.disabled = true;
      } else {
        btnText.style.display = 'inline';
        btnLoader.style.display = 'none';
        registerBtn.disabled = false;
      }
    }

    function showError(message) {
      errorDiv.textContent = message;
      errorDiv.style.display = 'block';
      successDiv.style.display = 'none';
    }

    function showSuccess(message) {
      successDiv.textContent = message;
      successDiv.style.display = 'block';
      errorDiv.style.display = 'none';
    }

    function redirectToDashboard(userData) {
      if (userData.role === 'admin') {
        window.location.href = 'admin_dashboard.html';
      } else {
        window.location.href = 'user_dashboard.html';
      }
    }
  };
});
</script>

<style>
/* Auth Container - Matching Dashboard Style */
.auth-container {
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(20px);
  width: 450px;
  padding: 3rem;
  margin: 2rem auto;
  border-radius: 20px;
  box-shadow: 0 25px 50px rgba(56, 62, 78, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.2);
  animation: slideUp 0.6s ease-out;
  position: relative;
  overflow: hidden;
}

.auth-container::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: linear-gradient(90deg, #667eea, #764ba2);
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.auth-header {
  text-align: center;
  margin-bottom: 2rem;
}

.auth-header h2 {
  font-size: 2.2rem;
  font-weight: 700;
  margin-bottom: 0.5rem;
  background: linear-gradient(135deg, #667eea, #764ba2);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.auth-subtitle {
  color: #64748b;
  font-size: 1.1rem;
  margin: 0;
}

/* Form Styles */
.auth-form {
  margin: 0;
}

.form-group {
  margin-bottom: 1.5rem;
}

.form-group label {
  display: block;
  margin-bottom: 0.5rem;
  font-weight: 600;
  color: #2c3e50;
  font-size: 0.95rem;
}

.form-group input {
  width: 100%;
  padding: 1rem 1.2rem;
  border: 2px solid #e1e8ed;
  border-radius: 12px;
  font-size: 1rem;
  transition: all 0.3s ease;
  background: rgba(255, 255, 255, 0.8);
  font-family: inherit;
}

.form-group input:focus {
  outline: none;
  border-color: #667eea;
  box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
  background: white;
}

.form-group input::placeholder {
  color: #95a5a6;
}

.form-group select {
  width: 100%;
  padding: 1rem 1.2rem;
  border: 2px solid #e1e8ed;
  border-radius: 12px;
  font-size: 1rem;
  transition: all 0.3s ease;
  background: rgba(255, 255, 255, 0.8);
  font-family: inherit;
}

.form-group select:focus {
  outline: none;
  border-color: #667eea;
  box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
  background: white;
}

/* Checkbox Group */
.checkbox-group {
  margin-bottom: 1rem;
}

.checkbox-label {
  display: flex;
  align-items: flex-start;
  cursor: pointer;
  font-size: 0.9rem;
  color: #64748b;
  line-height: 1.4;
}

.checkbox-label input[type="checkbox"] {
  margin-right: 0.5rem;
  margin-top: 0.2rem;
}

/* Button Styles */
.auth-btn {
  width: 100%;
  padding: 1rem;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 1.1rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  margin-bottom: 1.5rem;
  position: relative;
  overflow: hidden;
}

.auth-btn::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
  transition: left 0.5s;
}

.auth-btn:hover::before {
  left: 100%;
}

.auth-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
}

.auth-btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

.btn-loader {
  width: 20px;
  height: 20px;
  border: 2px solid #ffffff;
  border-top: 2px solid transparent;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* Links */
.auth-links {
  text-align: center;
  margin-top: 1.5rem;
}

.auth-links a {
  color: #667eea;
  text-decoration: none;
  font-weight: 500;
  transition: color 0.3s ease;
}

.auth-links a:hover {
  color: #764ba2;
  text-decoration: underline;
}

.auth-links p {
  margin: 0.5rem 0;
  color: #64748b;
  font-size: 0.9rem;
}

/* Messages */
.error {
  background: linear-gradient(135deg, #ff9a9e, #fecfef);
  color: #e74c3c;
  padding: 1rem;
  border-radius: 8px;
  margin-bottom: 1rem;
  border-left: 4px solid #e74c3c;
}

.success {
  background: linear-gradient(135deg, #a8edea, #fed6e3);
  color: #27ae60;
  padding: 1rem;
  border-radius: 8px;
  margin-bottom: 1rem;
  border-left: 4px solid #27ae60;
}

/* Responsive Design */
@media (max-width: 768px) {
  .auth-container {
    width: 90%;
    max-width: 400px;
    padding: 2rem;
    margin: 1rem auto;
  }

  .auth-header h2 {
    font-size: 1.8rem;
  }
}
</style>
</body>
</html>
